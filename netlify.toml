# Config de deploy en Netlify (conexión por repositorio).
# `npm run build` pre-renderiza y arma dist/ ; se publica solo dist/.
# (Para deploy por arrastre, subí directamente la carpeta dist/.)

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
